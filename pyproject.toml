[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-research-word"
version = "0.1.0"
description = "Word formatting workflow and local DOCX tools for Chinese materials science reports"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "jiazuolong"}]
dependencies = ["lxml>=4.9"]

[project.scripts]
format-research-word = "format_research_word.cli:main"

[project.urls]
Repository = "https://github.com/jiazuolong/format-research-word"

[tool.setuptools.packages.find]
where = ["src"]
